[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "trust-chain-mcp"
version = "1.0.4"
description = "Trust Chain MCP server. Tools: create trust anchor, verify chain, add attestation. Built by MEOK AI Labs."
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "nicholas@meok.ai"}]
dependencies = ["mcp>=1.0.0"]
keywords = ["mcp", "ai", "meok", "trust", "chain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/CSOAI-ORG/trust-chain-mcp"
[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py", "auth_middleware.py", "persistence.py"]

[project.scripts]
trust_chain_mcp = "server:main"
